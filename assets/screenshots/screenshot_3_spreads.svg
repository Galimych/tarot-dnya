<svg width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="bg3" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#1A0B2E"/>
<stop offset="100%" stop-color="#0D0221"/>
</linearGradient>
</defs>

<rect width="1080" height="1920" fill="url(#bg3)"/>

<circle cx="130" cy="140" r="3" fill="#F4C430" opacity="0.5"/>
<circle cx="960" cy="160" r="2.5" fill="#F4C430" opacity="0.5"/>

<text x="80" y="150" font-family="Georgia, serif" font-style="italic" font-size="44" fill="#F4C430">Ещё расклады</text>

<g transform="translate(80, 240)">
<rect x="0" y="0" width="920" height="220" rx="20" fill="#FFFFFF" opacity="0.03" stroke="#D4AF37" stroke-width="1.5" stroke-opacity="0.4"/>
<circle cx="90" cy="110" r="34" fill="none" stroke="#F4C430" stroke-width="3"/>
<path d="M90 90 C 70 90 65 115 90 130 C 115 115 110 90 90 90 Z" fill="#F4C430"/>
<text x="160" y="90" font-family="sans-serif" font-size="34" fill="#F5F0E8">На отношения</text>
<text x="160" y="135" font-family="sans-serif" font-size="24" fill="#B4A9D6">
<tspan x="160" dy="0">Три карты покажут, что</tspan>
<tspan x="160" dy="34">происходит между вами</tspan>
</text>
</g>

<g transform="translate(80, 500)">
<rect x="0" y="0" width="920" height="220" rx="20" fill="#FFFFFF" opacity="0.03" stroke="#D4AF37" stroke-width="1.5" stroke-opacity="0.4"/>
<rect x="60" y="76" width="60" height="68" rx="8" fill="none" stroke="#F4C430" stroke-width="3"/>
<line x1="60" y1="96" x2="120" y2="96" stroke="#F4C430" stroke-width="3"/>
<text x="160" y="90" font-family="sans-serif" font-size="34" fill="#F5F0E8">На неделю</text>
<text x="160" y="135" font-family="sans-serif" font-size="24" fill="#B4A9D6">
<tspan x="160" dy="0">Семь карт — по одной</tspan>
<tspan x="160" dy="34">на каждый день недели</tspan>
</text>
</g>

<g transform="translate(80, 760)">
<rect x="0" y="0" width="920" height="220" rx="20" fill="#FFFFFF" opacity="0.03" stroke="#D4AF37" stroke-width="1.5" stroke-opacity="0.4"/>
<circle cx="90" cy="110" r="34" fill="none" stroke="#F4C430" stroke-width="3"/>
<text x="90" y="122" font-family="Georgia, serif" font-size="38" fill="#F4C430" text-anchor="middle">?</text>
<text x="160" y="90" font-family="sans-serif" font-size="34" fill="#F5F0E8">Да / нет</text>
<text x="160" y="135" font-family="sans-serif" font-size="24" fill="#B4A9D6">
<tspan x="160" dy="0">Задумай вопрос</tspan>
<tspan x="160" dy="34">и вытяни одну карту</tspan>
</text>
</g>

<text x="540" y="1150" font-family="Georgia, serif" font-style="italic" font-size="30" fill="#B4A9D6" text-anchor="middle">Открой то, что важно знать сегодня</text>
</svg>
