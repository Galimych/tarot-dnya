name: tarot_dnya
description: "Таро дня — ежедневные карты и предсказания"
publish_to: 'none'
version: 1.0.0+28

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.3
  google_fonts: ^6.2.1
  share_plus: ^10.1.4
  screenshot: ^3.0.0
  intl: any
  yandex_mobileads: 7.18.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  sweph: ^4.1.0+2.10.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
