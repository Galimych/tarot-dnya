workflows:
  android-release:
    name: Android Release
    max_build_duration: 30
    environment:
      flutter: stable
      # Ключ подписи хранится не в репозитории, а в защищённом хранилище
      # Codemagic (Code signing identities) под этим именем. Из него
      # приходят переменные CM_KEYSTORE_PATH, CM_KEYSTORE_PASSWORD,
      # CM_KEY_ALIAS и CM_KEY_PASSWORD.
      android_signing:
        - tarot_dnya_keystore
    scripts:
      - name: Clean previous build artifacts
        script: |
          flutter clean
      - name: Regenerate missing Android project files
        script: |
          flutter create --platforms=android --org com.galimych .
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Enable core library desugaring (required by flutter_local_notifications)
        script: |
          if [ -f android/app/build.gradle.kts ]; then
            cat >> android/app/build.gradle.kts << 'EOF'

          android {
              compileOptions {
                  isCoreLibraryDesugaringEnabled = true
              }
          }

          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
          }
          EOF
          else
            cat >> android/app/build.gradle << 'EOF'

          android {
              compileOptions {
                  coreLibraryDesugaringEnabled true
              }
          }

          dependencies {
              coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
          }
          EOF
          fi
      - name: Convert SVG icon to PNG
        script: |
          brew install librsvg
          rsvg-convert -w 1024 -h 1024 assets/icon/app_icon.svg -o assets/icon/app_icon.png
      - name: Generate Android launcher icons
        script: |
          dart run flutter_launcher_icons
      - name: Build and sign Android App Bundle (release)
        script: |
          cat >> android/gradle.properties << EOF
          android.injected.signing.store.file=$CM_KEYSTORE_PATH
          android.injected.signing.store.password=$CM_KEYSTORE_PASSWORD
          android.injected.signing.key.alias=$CM_KEY_ALIAS
          android.injected.signing.key.password=$CM_KEY_PASSWORD
          EOF
          flutter build appbundle --release
      - name: Build installable APK for testing on your phone
        script: |
          flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/*.apk
